spring.application.name=PulsMiasta
# Database configuration
spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:puls_miasta}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DATABASE_USERNAME:user}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.servlet.context-path=/api
# Redis
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
# Auth
auth.session.ttl-minutes=15
auth.remember-me.web.ttl-days=30
auth.remember-me.mobile.ttl-days=90
# CORS
# Comma-separated list of allowed origins. Must be exact origins (no wildcards) because
# the API uses HttpOnly cookies (allowCredentials=true).
# WEB admin frontend + local dev. Add production URLs via environment variable.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://127.0.0.1:5500}
# WebAuthn / Passkey
# RP ID must match the registrable domain of your frontend origin (no scheme, no port).
# For local development use "localhost". For production use e.g. "pulsMiasta.example.com".
webauthn.rp-id=${WEBAUTHN_RP_ID:localhost}
# Human-readable name shown in the passkey dialog (Face ID prompt, browser UI, etc.)
webauthn.rp-name=${WEBAUTHN_RP_NAME:PulsMiasta}
# Comma-separated list of allowed origins. Must include the exact origin(s) your frontend/mobile app uses.
# For React Native / Expo with Associated Domains, add the android/apple app origin format.
webauthn.allowed-origins=${WEBAUTHN_ALLOWED_ORIGINS:http://localhost:3000,https://localhost:3000,http://127.0.0.1:5500}
# How long a WebAuthn challenge is valid before the ceremony must restart (seconds). Default: 5 minutes.
webauthn.challenge-ttl-seconds=${WEBAUTHN_CHALLENGE_TTL_SECONDS:300}
# Mail (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:noreply@example.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# App
app.base-url=${APP_BASE_URL:http://localhost:3000}
app.mail.from=${MAIL_FROM:noreply@example.com}
# Email verification token TTL in hours
auth.email-verification.ttl-hours=${AUTH_EMAIL_VERIFICATION_TTL_HOURS:24}
# Sudo mode — email OTP
auth.sudo-otp.ttl-minutes=${AUTH_SUDO_OTP_TTL_MINUTES:10}
auth.sudo-otp.cooldown-seconds=${AUTH_SUDO_OTP_COOLDOWN_SECONDS:60}
auth.sudo-otp.max-attempts=${AUTH_SUDO_OTP_MAX_ATTEMPTS:3}
# TOTP 2FA — pending login token TTL (seconds between login step 1 and step 2)
auth.totp.pending-ttl-minutes=${AUTH_TOTP_PENDING_TTL_MINUTES:5}