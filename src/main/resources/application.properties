spring.application.name=PulsMiasta
# Database configuration
spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:puls_miasta}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DATABASE_USERNAME:user}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.servlet.context-path=/api
# Redis
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
# Auth
auth.pesel.pepper=${PESEL_PEPPER:change-me-in-production-32chars!!}
auth.session.ttl-minutes=15
auth.remember-me.web.ttl-days=30
auth.remember-me.mobile.ttl-days=90