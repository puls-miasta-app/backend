spring.application.name=PulsMiasta
springdoc.swagger-ui.servers[0].url=http://localhost:8088
# Database configuration
spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:puls_miasta}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DATABASE_USERNAME:user}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.servlet.context-path=/api
# Redis
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
# Auth
auth.session.ttl-minutes=15
auth.remember-me.web.ttl-days=30
auth.remember-me.mobile.ttl-days=90
# Cookie flags. Dev defaults are http/localhost friendly — for production override via env:
#   AUTH_COOKIE_SECURE=true  (wymagane dla https)
#   AUTH_COOKIE_SAME_SITE=Strict (lub None gdy cross-site frontend; None wymaga Secure=true)
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
# CORS
# Comma-separated list of allowed origins. Must be exact origins (no wildcards) because
# the API uses HttpOnly cookies (allowCredentials=true).
# WEB admin frontend + local dev. Add production URLs via environment variable.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://127.0.0.1:5500,http://localhost:5173,http://localhost:8088,https://pulsmiasta.online}
# WebAuthn / Passkey
# RP ID must match the registrable domain of your frontend origin (no scheme, no port).
# For local development use "localhost". For production use e.g. "pulsMiasta.example.com".
webauthn.rp-id=${WEBAUTHN_RP_ID:localhost}
# Human-readable name shown in the passkey dialog (Face ID prompt, browser UI, etc.)
webauthn.rp-name=${WEBAUTHN_RP_NAME:PulsMiasta}
# Comma-separated list of allowed origins. Must include the exact origin(s) your frontend/mobile app uses.
# For React Native / Expo with Associated Domains, add the android/apple app origin format.
webauthn.allowed-origins=${WEBAUTHN_ALLOWED_ORIGINS:http://localhost:3000,https://localhost:3000,http://127.0.0.1:5500}
# How long a WebAuthn challenge is valid before the ceremony must restart (seconds). Default: 5 minutes.
webauthn.challenge-ttl-seconds=${WEBAUTHN_CHALLENGE_TTL_SECONDS:300}
# Android Digital Asset Links — exposed at GET /.well-known/assetlinks.json.
# Reverse proxy must route https://${WEBAUTHN_RP_ID}/.well-known/assetlinks.json
# to this endpoint (see AssetLinksController javadoc for an nginx snippet).
# Package name must match the Android app's applicationId exactly.
android.assetlinks.package-name=${ANDROID_PACKAGE_NAME:com.anonymous.pulsmiasta}
# Comma-separated list of SHA-256 certificate fingerprints (colon-separated
# uppercase hex, as produced by `keytool -list -v`). Include both the debug
# keystore fingerprint (for local expo/Android Studio builds) and the Play
# App Signing fingerprint (for production distribution).
android.assetlinks.sha256-fingerprints=${ANDROID_SHA256_FINGERPRINTS:}
# Mail (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:noreply@example.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.starttls.required=false
# App
app.base-url=${APP_BASE_URL:http://localhost:3000}
app.mail.from=${MAIL_FROM:noreply@example.com}
# Email verification token TTL in hours
auth.email-verification.ttl-hours=${AUTH_EMAIL_VERIFICATION_TTL_HOURS:24}
# Sudo mode — how long sudo is active after verification (minutes)
auth.sudo.ttl-minutes=${AUTH_SUDO_TTL_MINUTES:15}
# Sudo mode — email OTP
auth.sudo-otp.ttl-minutes=${AUTH_SUDO_OTP_TTL_MINUTES:10}
auth.sudo-otp.cooldown-seconds=${AUTH_SUDO_OTP_COOLDOWN_SECONDS:60}
auth.sudo-otp.max-attempts=${AUTH_SUDO_OTP_MAX_ATTEMPTS:3}
# Trusted device — how many days before user must pass 2FA again on this device
auth.trusted-device.ttl-days=${AUTH_TRUSTED_DEVICE_TTL_DAYS:30}
# TOTP 2FA — pending login token TTL (seconds between login step 1 and step 2)
auth.totp.pending-ttl-minutes=${AUTH_TOTP_PENDING_TTL_MINUTES:5}
# TOTP 2FA — setup token TTL (minutes between setup begin and confirm)
auth.totp.setup-ttl-minutes=${AUTH_TOTP_SETUP_TTL_MINUTES:10}
# Login — account lockout after N failed attempts
auth.login.max-attempts=${AUTH_LOGIN_MAX_ATTEMPTS:10}
auth.login.lockout-minutes=${AUTH_LOGIN_LOCKOUT_MINUTES:30}
auth.login.attempts-ttl-minutes=${AUTH_LOGIN_ATTEMPTS_TTL_MINUTES:15}
# Rate limiting — default settings
auth.rate-limit.default-limit=${AUTH_RATE_LIMIT_DEFAULT_LIMIT:10}
auth.rate-limit.default-window-seconds=${AUTH_RATE_LIMIT_DEFAULT_WINDOW_SECONDS:20}
# Comma-separated list of trusted proxy IPs for rate limiting
# Only these IPs can set X-Forwarded-For and X-Real-IP headers
# Empty = only trust direct connections (no proxy headers)
auth.rate-limit.trusted-proxies=${AUTH_RATE_LIMIT_TRUSTED_PROXIES:}
# Cloudflare R2 (S3-compatible)
storage.r2.endpoint=${R2_ENDPOINT:https://<account-id>.r2.cloudflarestorage.com}
storage.r2.access-key=${R2_ACCESS_KEY:}
storage.r2.secret-key=${R2_SECRET_KEY:}
storage.r2.bucket=${R2_BUCKET:puls-miasta-photos}
storage.r2.region=${R2_REGION:auto}
storage.r2.multipart-threshold=${R2_MULTIPART_THRESHOLD:5242880}
storage.r2.multipart-part-size=${R2_MULTIPART_PART_SIZE:5242880}
storage.r2.max-file-size=${R2_MAX_FILE_SIZE:20971520}
# Spring multipart limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
# Gemini (Google Generative Language API) — async image analysis for reports
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
ai.gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:30}
# Minimum confidence (0..1) to accept Gemini's analysis. Below this we leave AI fields empty and skip dedup.
ai.gemini.min-confidence=${GEMINI_MIN_CONFIDENCE:0.3}
# Expo Push Notifications API
push.expo.url=${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}