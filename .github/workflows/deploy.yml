name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: deploy
          port: 58273
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker network create puls-miasta 2>/dev/null || true
            cd /home/deploy/puls-miasta/backend
            git pull origin main
            docker compose down
            docker compose up -d --build
