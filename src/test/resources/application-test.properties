spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.data.redis.host=localhost
spring.data.redis.port=6379

geo.import.enabled=false

cors.allowed-origins=http://localhost
auth.session.ttl-minutes=15
auth.remember-me.web.ttl-days=30
auth.remember-me.mobile.ttl-days=90
auth.cookie.secure=false
auth.cookie.same-site=Lax
auth.totp.issuer=TestIssuer
auth.totp.pending-ttl-minutes=5
auth.totp.setup-ttl-minutes=10
auth.sudo.ttl-minutes=15
auth.sudo-otp.ttl-minutes=10
auth.sudo-otp.cooldown-seconds=60
auth.sudo-otp.max-attempts=3
auth.login-otp.ttl-minutes=10
auth.login-otp.cooldown-seconds=60
auth.login-otp.max-attempts=3
auth.email-verification.ttl-hours=24
auth.login.max-attempts=5
auth.login.attempts-ttl-minutes=15
auth.login.lockout-minutes=30
auth.rate-limit.default-limit=10
auth.rate-limit.default-window-seconds=60
auth.rate-limit.trusted-proxies=

app.base-url=http://localhost:8080
app.mail.from=test@example.com

storage.r2.endpoint=http://localhost
storage.r2.access-key=test
storage.r2.secret-key=test
storage.r2.bucket=test-bucket

ai.gemini.api-key=test
ai.gemini.model=gemini-test
ai.gemini.base-url=http://localhost
ai.gemini.timeout-seconds=5
ai.gemini.min-confidence=0.3
push.expo.url=http://localhost
android.assetlinks.package-name=com.test
android.assetlinks.sha256-fingerprints=
